name: daily-publish

on:
  schedule:
    - cron: "0 21 * * *"  # 매일 06:00 KST. GitHub 예약은 2~3시간 밀리기도 해서 9시 전후 발행을 노려 새벽으로 당김
  workflow_dispatch:
    inputs:
      n:
        description: "발행할 글 수"
        default: "5"

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: |
          git config user.name "9yurrr"
          git config user.email "9yurrr@users.noreply.github.com"
      - name: publish
        run: python publish.py run ${{ inputs.n || '5' }}
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: save state (발행 기록은 실패해도 남김)
        if: always()
        run: |
          git add state.json hubs.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%F)" && git pull --rebase -q origin main && git push)
